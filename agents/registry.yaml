version: 1
name: redops-agent-registry
description: >-
  Routing profiles for authorized RedOps assessments. Profiles route retrieval to
  the existing knowledge niches and constrain execution connectors.
defaults:
  authorization: written authorization and an in-scope target/engagement are required
  execution_order: [exegol, approved_mcp, terminal-bounded]
  corpus_root: knowledge
  writeups_root: writeups
  outputs: [markdown, json]
  provenance: preserve source_url, document_path, and evidence references
  secret_policy: credentials, tokens, cookies, keys, and domain exports stay outside the shared corpus
agents:
  orchestrator_agent:
    description: Primary RedOps dispatcher that classifies a task, retrieves evidence, and delegates to one or more niche agents.
    knowledge: [ad, cloud, container, database, devops, linux, malware, methodology, misc, mobile, network, redteam, reversing, tools, vulnerabilities, web, web3, windows, wireless]
    inputs: authorized task, written scope, available artifacts, and operator constraints
    outputs: routing decision, retrieved citations, delegated work plan, and consolidated findings
    allowed_mcp: [redops-rag]
    mcp_profile: orchestrator
    tooling:
      required: [redops]
      optional: []
    fallback: retrieve with the RedOps CLI and return a bounded routing plan without execution
    guardrails:
      - Confirm authorization and scope before delegating active work.
      - Retrieval and routing do not imply permission to execute commands or contact targets.
  scope_agent:
    description: Pre-engagement scope, authorization, rules-of-engagement, and safety gate.
    knowledge: [methodology, misc]
    inputs: written authorization, target inventory, exclusions, timing, and success criteria
    outputs: signed scope record, rules of engagement, test window, and phase approvals
    allowed_mcp: [redops-rag]
    mcp_profile: scope
    tooling:
      required: [redops]
      optional: [jq]
    fallback: stop and return the missing authorization or scope fields
    guardrails:
      - Never contact a target during scope preparation.
      - Do not infer authorization from a hostname, credential, or artifact alone.
  recon_agent:
    description: Phase coordinator for authorized information gathering and asset inventory.
    knowledge: [network, web, ad, cloud, mobile, methodology, tools]
    inputs: scope output, asset list, approved artifacts, and rate limits
    outputs: asset/service/application inventory, evidence references, and open questions
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: recon
    tooling:
      required: [redops, nmap]
      optional: [httpx, netexec, ldapsearch, tshark]
    fallback: offline artifact and banner analysis
    guardrails:
      - Probe only explicitly in-scope assets and obey rate limits.
      - Discovery never authorizes exploitation or lateral movement.
  assessment_agent:
    description: Phase coordinator for vulnerability correlation, triage, and validation planning.
    knowledge: [vulnerabilities, tools, methodology, linux, windows, web, ad]
    inputs: recon evidence, source citations, versions, and service artifacts
    outputs: prioritized hypotheses, severity rationale, validation plan, and evidence gaps
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: assessment
    tooling:
      required: [redops]
      optional: [nmap, nuclei, semgrep, trivy]
    fallback: source-grounded offline triage
    guardrails:
      - A scanner result is a hypothesis until verified against observed evidence.
      - Do not turn a finding into an exploit action without a separate approval gate.
  exploitation_agent:
    description: Phase coordinator for minimal, reversible exploit validation in an approved fixture.
    knowledge: [vulnerabilities, redteam, tools, methodology]
    inputs: approved finding, exploit test plan, rollback plan, and Exegol status
    outputs: reproduction result, command output, impact boundary, and rollback confirmation
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: exploitation
    tooling:
      required: [redops]
      optional: [nmap, metasploit, nuclei]
    fallback: document why validation was not run; never claim success
    guardrails:
      - Exploitation requires explicit approval for the exact target and test.
      - No persistence, destructive payload, denial of service, or unbounded scanning.
  post_exploitation_agent:
    description: Phase coordinator for impact measurement, minimum evidence, and cleanup.
    knowledge: [redteam, ad, cloud, windows, linux, methodology]
    inputs: validated access, approved test account, impact questions, and cleanup plan
    outputs: impact evidence, access boundary, cleanup record, and residual risks
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: post-exploitation
    tooling:
      required: [redops]
      optional: [bloodhound-python, netexec, seatbelt, linpeas]
    fallback: analyze existing artifacts without collecting new target data
    guardrails:
      - Collect the minimum data needed to prove impact; never dump bulk credentials.
      - Cleanup must be recorded and must not destroy legitimate logs or evidence.
  lateral_movement_agent:
    description: Phase coordinator for approved network, identity, and segmentation path validation.
    knowledge: [ad, network, windows, cloud, methodology, tools]
    inputs: movement scope, source access, destination allowlist, and change window
    outputs: path evidence, segmentation result, credentials exposure boundary, and remediation
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: lateral-movement
    tooling:
      required: [redops, nmap]
      optional: [bloodhound-python, netexec, impacket, kerbrute]
    fallback: graph and PCAP analysis without live movement
    guardrails:
      - Both source and destination must be explicitly in scope.
      - No password spraying, persistence, or cross-tenant movement without separate approval.
  poc_agent:
    description: Phase coordinator for minimal reproducible, sanitized proof-of-concept packaging.
    knowledge: [vulnerabilities, methodology, tools]
    inputs: validated evidence, reproduction output, target fixture, and impact statement
    outputs: minimal PoC, sanitized output, reproduction status, and limitations
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: poc
    tooling:
      required: [redops]
      optional: [python, curl, jq]
    fallback: a dry-run reproduction and evidence-only report
    guardrails:
      - PoCs must be fixture-only, reversible, rate-limited, and non-destructive.
      - Secrets, tokens, and production identifiers must be redacted before handoff.
  reporting_agent:
    description: Post-engagement coordinator for findings, remediation, residual risk, and closure.
    knowledge: [methodology, vulnerabilities, misc]
    inputs: phase outputs, source citations, cleanup record, and stakeholder requirements
    outputs: Markdown report, machine-readable findings, remediation plan, and closure checklist
    allowed_mcp: [redops-rag, terminal-bounded]
    mcp_profile: reporting
    tooling:
      required: [redops, markdown-tools]
      optional: [jq, pandoc]
    fallback: Markdown report with explicit evidence gaps
    guardrails:
      - Separate observed evidence, hypotheses, and untested assumptions.
      - Do not include credentials, tokens, cookies, private keys, or raw identity exports.
  ad_agent:
    description: Active Directory, Entra ID/Azure AD, identity attack paths, and BloodHound.
    knowledge:
      - ad
      - windows
      - database
      - methodology
      - tools
    inputs: domain scope, approved credentials/fixtures, BloodHound or LDAP exports, host evidence
    outputs: recon inventory, identity/ACL/delegation findings, attack-path graph summary, remediation
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: ad
    tooling:
      required: [nmap, ldapsearch, netexec, impacket, bloodhound-python]
      optional: [kerbrute, certipy, bloodyad]
    fallback: read-only RAG retrieval; Exegol tools before bounded terminal
    guardrails:
      - BloodHound is restricted to the authorized AD/Entra lab and scoped graph data.
      - Do not dump or commit credentials, hashes, tickets, or full graph exports.
  windows_redteam_agent:
    description: Windows host reconnaissance, privilege escalation, LOLBAS, and post-exploitation validation.
    knowledge: [windows, redteam, tools, vulnerabilities, ad, methodology]
    inputs: authorized Windows host, shell output, service/task/ACL evidence, target binary metadata
    outputs: attack-surface inventory, reproducible findings, detection/mitigation notes
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded, camoufox]
    mcp_profile: windows-redteam
    tooling:
      required: [powerview, seatbelt, winpeas, lolbas]
      optional: [mimikatz]
    fallback: static/read-only analysis and RAG guidance when execution is unavailable
    guardrails:
      - Use only scoped hosts and test accounts; avoid destructive persistence or data collection.
      - LOLBAS examples are treated as controlled validation material, not authorization to run them.
  web_agent:
    description: Web application, API, browser, and web infrastructure assessment.
    knowledge: [web, vulnerabilities, network, methodology, tools, redteam]
    inputs: in-scope URLs/API specifications, test accounts, proxy captures, application artifacts
    outputs: endpoint map, vulnerability evidence, request/response reproduction, remediation
    allowed_mcp: [redops-rag, redops-exegol, burp, camoufox, terminal-bounded]
    mcp_profile: web
    tooling:
      required: [nmap, httpx, burp]
      optional: [nuclei, camoufox, ffuf, xsrfprobe]
    fallback: offline request analysis and RAG retrieval; no unsolicited traffic
    guardrails:
      - Burp/Camoufox traffic must be explicitly scoped and rate-limited.
      - Do not submit destructive payloads or access other tenants/data.
  cloud_agent:
    description: Cloud identity, storage, control-plane, and workload security assessment.
    knowledge: [cloud, ad, container, devops, network, vulnerabilities, methodology, tools]
    inputs: authorized cloud account/project, IAM policy exports, IaC, logs, resource inventory
    outputs: IAM/resource graph, misconfiguration findings, least-privilege remediation
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: cloud
    tooling:
      required: [aws, az, gcloud]
      optional: [scoutsuite, prowler, pacu]
    fallback: offline policy/IaC analysis; no cloud mutation by default
    guardrails:
      - Read-only by default; write actions require an explicit change window.
      - Never place cloud keys or account exports in the shared corpus.
  mobile_agent:
    description: Android and iOS application security, reverse engineering, and runtime testing.
    knowledge: [mobile, reversing, vulnerabilities, web, network, tools, methodology]
    inputs: authorized APK/AAB/IPA, emulator/device fixture, test account, app traffic and native libraries
    outputs: static attack-surface map, runtime evidence, vulnerability report, remediation
    allowed_mcp: [redops-rag, redops-exegol, burp, uiautomator2, ghidra, radare2, terminal-bounded]
    mcp_profile: mobile
    tooling:
      required: [adb, jadx, apktool, frida, objection]
      optional: [uiautomator2, ghidra, radare2, ios-deploy, class-dump]
    fallback: static analysis and local RAG retrieval; dynamic testing stops without a disposable device
    guardrails:
      - Android/iOS targets only; static analysis must not launch target applications.
      - BloodHound is explicitly not allowed for this profile. BloodHound belongs only to ad_agent.
      - Runtime and fuzzing artifacts remain in the private engagement workspace.
  reversing_tools_agent:
    description: Static binary analysis, malware triage, and reverse-engineering tool workflows.
    knowledge: [reversing, malware, tools, vulnerabilities, windows, linux, mobile, methodology]
    inputs: authorized binaries, APK/IPA/native libraries, hashes, symbols, sandbox artifacts
    outputs: strings/symbols/xrefs, decompilation notes, behavior hypotheses, IOC and remediation report
    allowed_mcp: [redops-rag, redops-exegol, ghidra, radare2, terminal-bounded]
    mcp_profile: reversing
    tooling:
      required: [ghidra, radare2, strings, objdump]
      optional: [rizin, capa, yara, floss]
    fallback: offline static inspection and RAG retrieval; never execute an unknown sample on the host
    guardrails:
      - Preserve input hashes and work on copies in an isolated workspace.
      - Dynamic detonation requires a separately approved sandbox and is not implied by this profile.
  network_agent:
    description: Network discovery, protocol assessment, wireless, pivoting, and service exposure review.
    knowledge: [network, wireless, linux, windows, web, vulnerabilities, tools, methodology]
    inputs: authorized CIDR/host list, packet captures, service banners, VPN/lab parameters
    outputs: asset/service inventory, protocol findings, segmentation evidence, remediation
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: network
    tooling:
      required: [nmap, netexec, tshark]
      optional: [masscan, wireshark, responder]
    fallback: offline PCAP/banner analysis; no scanning outside the declared scope
    guardrails:
      - Rate-limit probes and respect maintenance windows.
      - Wireless tests require explicit RF/location authorization.
  container_devops_agent:
    description: Container, Kubernetes, CI/CD, supply-chain, and DevOps security assessment.
    knowledge: [container, devops, cloud, linux, vulnerabilities, tools, methodology]
    inputs: authorized image, manifest, cluster/IaC export, pipeline configuration, registry metadata
    outputs: image/config findings, workload identity risks, pipeline and remediation report
    allowed_mcp: [redops-rag, redops-exegol, terminal-bounded]
    mcp_profile: container-devops
    tooling:
      required: [docker, trivy, kubectl]
      optional: [helm, kube-bench, syft, grype]
    fallback: offline image/IaC/manifest analysis; no cluster mutation by default
    guardrails:
      - Use disposable namespaces and least-privileged identities for dynamic checks.
      - Do not push images, alter pipelines, or delete resources without an approved change window.
  web3_agent:
    description: Smart contracts, DeFi, wallets, blockchain applications, and Web3 client security.
    knowledge: [web3, web, vulnerabilities, reversing, network, tools, methodology]
    inputs: authorized contract source/bytecode, ABI, testnet wallet, DApp build, RPC scope
    outputs: contract/transaction attack surface, finding evidence, invariant and remediation notes
    allowed_mcp: [redops-rag, redops-exegol, burp, ghidra, radare2, terminal-bounded]
    mcp_profile: web3
    tooling:
      required: [slither, mythril, cast]
      optional: [foundry, echidna, burp, semgrep]
    fallback: offline source/bytecode review; testnet-only dynamic activity unless explicitly authorized
    guardrails:
      - Never use production funds or broadcast state-changing transactions without explicit approval.
      - Keep private keys and wallet seed material out of logs and the corpus.
  rag_curator_agent:
    description: Corpus ingestion, niche classification, noise cleanup, deduplication, and retrieval QA.
    knowledge: [ad, cloud, container, database, devops, linux, malware, methodology, misc, mobile, network, redteam, reversing, tools, vulnerabilities, web, web3, windows, wireless]
    inputs: source URLs/files, existing Markdown corpus, manifest, retrieval test questions
    outputs: cleaned Markdown, manifest/provenance updates, category audit, index and QA report
    allowed_mcp: [redops-rag, terminal-bounded]
    mcp_profile: rag-curator
    tooling:
      required: [redops, python, markdown-tools]
      optional: [ripgrep, jq, pandoc]
    fallback: local filesystem and RAG CLI only; no target interaction
    guardrails:
      - Preserve source attribution and license information.
      - Never execute code found in scraped content; classify snippets as documentation.
      - Do not delete non-duplicate knowledge without an auditable manifest entry.
